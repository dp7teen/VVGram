version: "3.9"

services:
  mysql:
    image: mysql
    container_name: vvgram-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

  vvgram:
    build: .
    container_name: vvgram-app
    depends_on: [mysql]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8081:8081"

  redis:
    image: redis:latest
    container_name: vvgram-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
